const list = document.getElementById('test-list');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

function formatDuration(ms) {
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function renderTests(filter) {
  const filtered = filter === 'all' ? tests : tests.filter(t => {
    if (filter === 'failed') return t.status === 'failed' || t.status === 'timedOut';
    if (filter === 'passed') return t.status === 'passed';
    return true;
  });
  list.innerHTML = filtered.map(t => {
    const statusClass = ['passed', 'failed', 'timedOut'].includes(t.status) ? t.status : 'other';
    const statusLabel = { passed: '通过', failed: '失败', timedOut: '超时', skipped: '跳过' }[t.status] || t.status.toUpperCase();
    let body = '';
    if (t.error) body += '<div class="section-title">错误信息</div><div class="error-box">' + escapeHtml(t.error) + '</div>';
    if (t.screenshotDataUris.length > 0) {
      body += '<div class="section-title">截图</div><div class="screenshots">';
      body += t.screenshotDataUris.map(s => '<img src="' + s.uri + '" alt="' + escapeHtml(s.name) + '" onclick="showLightbox(this.src)">').join('');
      body += '</div>';
    }
    if (t.videoDataUris.length > 0) {
      body += '<div class="section-title">录屏</div>';
      body += t.videoDataUris.map(v => '<video class="video-player" controls src="' + v.uri + '"></video>').join('');
    }
    if (!t.error && t.screenshotDataUris.length === 0 && t.videoDataUris.length === 0) {
      body = '<div class="no-media">无截图或录屏</div>';
    }
    return '<div class="test-item" data-status="' + t.status + '">' +
      '<div class="test-header">' +
      '<div class="status-badge ' + statusClass + '"></div>' +
      '<div class="test-title">' + escapeHtml(t.title) + ' <span style="font-size:11px;color:#999">[' + statusLabel + ']</span></div>' +
      '<div class="test-suite">' + escapeHtml(t.suite) + '</div>' +
      '<div class="test-duration">' + formatDuration(t.duration) + '</div>' +
      '</div>' +
      '<div class="test-body">' + body + '</div>' +
      '</div>';
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('active');
}

lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTests(btn.dataset.filter);
  });
});

document.getElementById('test-list').addEventListener('click', (e) => {
  const header = e.target.closest('.test-header');
  if (header) header.parentElement.classList.toggle('open');
});

renderTests('all');
</script>
